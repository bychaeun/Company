name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable APK
        run: gradle -p android-app :app:assembleDebug --no-daemon
      - name: Name APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk CHAE-EUN-ZIP.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CHAE-EUN-ZIP-Android
          path: CHAE-EUN-ZIP.apk
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" CHAE-EUN-ZIP.apk --title "CHAE EUN.ZIP Android" --notes "Android 설치 파일입니다. 내려받은 APK를 열어 설치하세요. 앱은 Google 로그인 호환성을 위해 휴대폰 브라우저의 안전한 Custom Tab으로 실행됩니다."
